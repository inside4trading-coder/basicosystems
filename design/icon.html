<!doctype html>
<!--
  Fuente del icono de Basico System. De aquí salen el favicon.ico (16/32/48) y
  los PNG cuadrados de public/.

  Marca: el isotipo es `[B]` en Chakra Petch, tal como lo define
  src/components/BrandMark.tsx — el lockup completo es `[B] SYSTEMS`, pero ese
  mismo fichero indica que por debajo de ~150 px de ancho se usa sólo `[B]`.
  Un icono de pestaña son 16 px, así que aquí siempre va el isotipo.

  Blanco sobre azul primario #0A37FF: la variante `onPrimary` del BrandMark, y
  el mismo par que los botones de la interfaz.

  Por qué se mide la caja de tinta en lugar de fiarse del cuerpo de la fuente:
  la métrica de la fuente reserva espacio muerto arriba y abajo (interlínea,
  ascendentes sin usar). Centrando por la caja del texto, el glifo sale pequeño
  y descolocado. Midiendo los píxeles que realmente pinta, se encaja centrado y
  al máximo tamaño que permita el margen.

  Uso:  icon.html?size=192&margen=0.10&forma=circulo
  Regenerar todo:  node design/generate-assets.cjs
-->
<meta charset="utf-8">
<title>Basico System — icono</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
<canvas id="out"></canvas>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const SIZE   = +(params.get('size')   || 512);
/* Fracción del lado que se deja libre por cada borde. Los iconos `maskable` de
   Android necesitan ~20 % porque el sistema les recorta un círculo; el favicon
   quiere el mínimo para que el isotipo sea lo mayor posible. */
const MARGEN = +(params.get('margen') || 0.08);
const FONDO  = params.get('fondo') || '#0A37FF';
const TINTA  = params.get('tinta') || '#FFFFFF';
const GLIFO  = params.get('glifo') || '[B]';
/* `circulo` deja las esquinas transparentes. No vale para todos los destinos:
   el icono `maskable` y el de iOS tienen que ir a sangre —el sistema les aplica
   su propia máscara y rellena de negro lo que encuentre transparente—, así que
   esos dos se piden como `cuadrado`. */
const FORMA  = params.get('forma') || 'circulo';

const listo = (async () => {
  await document.fonts.load('700 400px "Chakra Petch"');
  await document.fonts.ready;

  /* 1 · Pintar el isotipo muy grande en un lienzo auxiliar */
  const G = 512;
  const aux = document.createElement('canvas');
  aux.width = aux.height = G * 3;
  const a = aux.getContext('2d');
  a.fillStyle = '#fff';
  a.textBaseline = 'middle';
  a.textAlign = 'center';
  a.font = `700 ${G}px "Chakra Petch", system-ui, sans-serif`;
  /* -0.01em de tracking, igual que el lockup del BrandMark */
  a.letterSpacing = `${-0.01 * G}px`;
  a.fillText(GLIFO, G * 1.5, G * 1.5);

  /* 2 · Caja real de tinta: primer y último píxel con alfa */
  const d = a.getImageData(0, 0, aux.width, aux.height).data;
  let x0 = aux.width, y0 = aux.height, x1 = -1, y1 = -1;
  for (let y = 0; y < aux.height; y++) {
    for (let x = 0; x < aux.width; x++) {
      if (d[(y * aux.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  const gw = x1 - x0 + 1, gh = y1 - y0 + 1;

  /* 3 · Teñir el glifo, y sólo el glifo.
     Se hace aquí, en el lienzo auxiliar, que está transparente salvo la tinta.
     Con `source-in` el relleno se limita a los píxeles ya opacos y conserva su
     alfa, así que el antialias del borde sobrevive. Hacerlo después de componer
     sobre el fondo teñiría también el fondo. */
  a.globalCompositeOperation = 'source-in';
  a.fillStyle = TINTA;
  a.fillRect(0, 0, aux.width, aux.height);
  a.globalCompositeOperation = 'source-over';

  /* 4 · Encajar esa caja centrada en el cuadro final */
  const out = document.getElementById('out');
  out.width = out.height = SIZE;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = true;
  o.imageSmoothingQuality = 'high';
  o.fillStyle = FONDO;
  if (FORMA === 'circulo') {
    o.beginPath();
    // el radio se queda medio píxel corto del borde para que el antialias del
    // contorno no se coma la última fila y el círculo no salga recortado
    o.arc(SIZE / 2, SIZE / 2, SIZE / 2 - 0.5, 0, Math.PI * 2);
    o.fill();
    o.clip();   // todo lo que venga después queda confinado al círculo
  } else {
    o.fillRect(0, 0, SIZE, SIZE);
  }

  /* Cuánto se puede agrandar el glifo sin salirse.
     En cuadrado basta con que quepa por el lado más justo.
     En círculo lo que tiene que caber son las ESQUINAS de la caja del glifo:
     con la caja centrada, la condición es (ancho/2)² + (alto/2)² ≤ r², de donde
     k = 2r / √(gw² + gh²). Encajar en el cuadrado inscrito sería más simple
     pero deja el isotipo bastante más pequeño de lo que cabe. */
  let k;
  if (FORMA === 'circulo') {
    const r = (SIZE / 2) * (1 - MARGEN);
    k = (2 * r) / Math.hypot(gw, gh);
  } else {
    const libre = SIZE * (1 - 2 * MARGEN);
    k = Math.min(libre / gw, libre / gh);
  }
  const dw = gw * k, dh = gh * k;
  o.drawImage(aux, x0, y0, gw, gh,
              Math.round((SIZE - dw) / 2), Math.round((SIZE - dh) / 2), dw, dh);

  document.body.style.width = document.body.style.height = SIZE + 'px';
  return { gw, gh, k: +k.toFixed(3) };
})();
window.__icono = listo;
</script>
