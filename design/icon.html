<!doctype html>
<!--
  Fuente del icono de Basico System. De aquí salen el favicon.ico (16/32/48) y
  los PNG cuadrados de public/.

  Por qué una sola "B" y no el wordmark: en una pestaña el icono son 16 px.
  "BASICO" son seis letras, menos de tres píxeles cada una — no es cuestión de
  agrandarlas, es que no caben. Un glifo llenando el cuadro es la letra más
  grande posible y queda simétrica.

  Por qué Fixedsys: es la misma tipografía que la landing, y siendo bitmap sus
  trazos son rectos y de grosor uniforme, que es lo que sobrevive al reducir.

  Por qué se mide la caja de tinta en lugar de fiarse del cuerpo de la fuente:
  Fixedsys reserva mucho espacio muerto alrededor del glifo (interlínea y
  prosa). Centrando por la caja del texto, la B sale pequeña y descolocada
  arriba a la izquierda. Midiendo los píxeles que realmente pinta, se puede
  encajar centrada y al máximo tamaño que permita el margen.

  Uso:  icon.html?size=192&margen=0.10
  Regenerar todo:  node design/generate-assets.cjs
-->
<meta charset="utf-8">
<title>Basico System — icono</title>
<style>
  @font-face {
    font-family: "Fixedsys Excelsior";
    src: url("../public/fonts/fixedsys-excelsior-subset.woff2") format("woff2");
    font-display: block;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
<canvas id="out"></canvas>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const SIZE   = +(params.get('size')   || 512);
/* Fracción del lado que se deja libre por cada borde. Los iconos `maskable` de
   Android necesitan ~20 % porque el sistema les recorta un círculo; el favicon
   quiere el mínimo para que la letra sea lo mayor posible. */
const MARGEN = +(params.get('margen') || 0.08);
const FONDO  = params.get('fondo') || '#0000AA';
/* Gris claro sobre azul rey: el mismo par que el confeti de la landing. */
const TINTA  = params.get('tinta') || '#B3B3B3';
/* `circulo` deja las esquinas transparentes. No vale para todos los destinos:
   el icono `maskable` y el de iOS tienen que ir a sangre —el sistema les aplica
   su propia máscara y rellena de negro lo que encuentre transparente—, así que
   esos dos se piden como `cuadrado`. */
const FORMA  = params.get('forma') || 'circulo';

const listo = (async () => {
  await document.fonts.load('400px "Fixedsys Excelsior"');
  await document.fonts.ready;

  /* 1 · Pintar la B muy grande en un lienzo auxiliar */
  const G = 512;
  const aux = document.createElement('canvas');
  aux.width = aux.height = G * 2;
  const a = aux.getContext('2d');
  a.fillStyle = '#fff';
  a.textBaseline = 'middle';
  a.textAlign = 'center';
  a.font = `${G}px "Fixedsys Excelsior", monospace`;
  a.fillText('B', G, G);

  /* 2 · Caja real de tinta: primer y último píxel con alfa */
  const d = a.getImageData(0, 0, aux.width, aux.height).data;
  let x0 = aux.width, y0 = aux.height, x1 = -1, y1 = -1;
  for (let y = 0; y < aux.height; y++) {
    for (let x = 0; x < aux.width; x++) {
      if (d[(y * aux.width + x) * 4 + 3] > 8) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  const gw = x1 - x0 + 1, gh = y1 - y0 + 1;

  /* 3 · Encajar esa caja centrada en el cuadro final */
  /* 3 · Teñir la letra, y sólo la letra.
     Se hace aquí, en el lienzo auxiliar, que está transparente salvo el glifo.
     Con `source-in` el relleno se limita a los píxeles ya opacos y conserva su
     alfa, así que el antialias del borde sobrevive. Hacerlo después de
     componer sobre el fondo teñiría también el fondo — el icono salía gris
     entero, sin azul. */
  a.globalCompositeOperation = 'source-in';
  a.fillStyle = TINTA;
  a.fillRect(0, 0, aux.width, aux.height);
  a.globalCompositeOperation = 'source-over';

  /* 4 · Encajar esa caja centrada en el cuadro final */
  const out = document.getElementById('out');
  out.width = out.height = SIZE;
  const o = out.getContext('2d');
  o.imageSmoothingEnabled = true;
  o.imageSmoothingQuality = 'high';
  o.fillStyle = FONDO;
  if (FORMA === 'circulo') {
    o.beginPath();
    // el radio se queda medio píxel corto del borde para que el antialias del
    // contorno no se coma la última fila y el círculo no salga recortado
    o.arc(SIZE / 2, SIZE / 2, SIZE / 2 - 0.5, 0, Math.PI * 2);
    o.fill();
    // todo lo que venga después queda confinado al círculo
    o.clip();
  } else {
    o.fillRect(0, 0, SIZE, SIZE);
  }

  /* Cuánto se puede agrandar el glifo sin salirse.
     En cuadrado basta con que quepa por el lado más justo.
     En círculo lo que tiene que caber son las ESQUINAS de la caja del glifo:
     con la caja centrada, la condición es (ancho/2)² + (alto/2)² ≤ r². De ahí
     sale k = 2r / √(gw² + gh²). Encajar en el cuadrado inscrito —lado igual al
     diámetro entre √2— sería más simple pero deja la letra un 28 % más pequeña
     de lo que cabe, porque la B es bastante más alta que ancha. */
  let k;
  if (FORMA === 'circulo') {
    const r = (SIZE / 2) * (1 - MARGEN);
    k = (2 * r) / Math.hypot(gw, gh);
  } else {
    const libre = SIZE * (1 - 2 * MARGEN);
    k = Math.min(libre / gw, libre / gh);
  }
  const dw = gw * k, dh = gh * k;
  o.drawImage(aux, x0, y0, gw, gh,
              Math.round((SIZE - dw) / 2), Math.round((SIZE - dh) / 2), dw, dh);

  document.body.style.width = document.body.style.height = SIZE + 'px';
  return { gw, gh, k: +k.toFixed(3) };
})();
window.__icono = listo;
</script>
