<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!--
      Las etiquetas van aquí, estáticas, y no por JavaScript: los rastreadores
      sociales (Facebook, LinkedIn, WhatsApp, X) no ejecutan JS y sólo leen este
      HTML. Inyectarlas desde React llegaría a Google, que sí renderiza, pero no
      a la vista previa del enlace, que es lo que se quiere arreglar.

      Al cambiar de dominio hay que tocar canonical, og:url y og:image aquí,
      más public/sitemap.xml y public/robots.txt. Está listado en el README.
    -->
    <title>B Systems — Software para administrar y operar tu negocio</title>
    <meta name="description" content="Empieza con B Systems Start por $29.99 al mes o construye B Systems alrededor de la operación de tu empresa con Custom." />
    <link rel="canonical" href="https://basicosystems.com/" />

    <!-- Tipografía de marca [B] SYSTEMS: Chakra Petch (display) y JetBrains
         Mono (datos/etiquetas). Preconnect antes de los links de fuente. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <!-- Iconos. Sin esto el navegador sólo encuentra /favicon.ico por convención
         y no sabe qué resolución elegir.
         Pendiente: sustituir por los assets oficiales del manual [B] SYSTEMS
         (regla: sólo el isotipo [B] dentro del contenedor azul, nunca el
         lockup completo). Se mantienen los archivos actuales hasta recibirlos. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A37FF" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="B SYSTEMS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph. Las URL de imagen han de ser absolutas: los rastreadores no
         resuelven rutas relativas.
         La tarjeta va en JPEG y no PNG: con el degradado del hero, en PNG
         pesaba 297 kB y WhatsApp degrada la vista previa grande a un thumbnail
         cuadrado por encima de ~300 kB. Se regenera con
         `node design/generate-assets.cjs`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="B Systems" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://basicosystems.com/" />
    <meta property="og:title" content="B Systems — Software para administrar y operar tu negocio" />
    <meta property="og:description" content="Empieza con B Systems Start por $29.99 al mes o construye B Systems alrededor de la operación de tu empresa con Custom." />
    <meta property="og:image" content="https://basicosystems.com/og-b-systems.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="B Systems: software para administrar y operar tu negocio." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="B Systems — Software para administrar y operar tu negocio" />
    <meta name="twitter:description" content="Empieza con B Systems Start por $29.99 al mes o construye B Systems alrededor de la operación de tu empresa con Custom." />
    <meta name="twitter:image" content="https://basicosystems.com/og-b-systems.jpg" />
    <meta name="twitter:image:alt" content="B Systems: software para administrar y operar tu negocio." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://basicosystems.com/#organizacion",
          "name": "B Systems",
          "url": "https://basicosystems.com/",
          "logo": "https://basicosystems.com/icon-512.png",
          "description": "Software para administrar y operar negocios, listo para empezar o construido a medida."
        },
        {
          "@type": "WebSite",
          "@id": "https://basicosystems.com/#sitio",
          "url": "https://basicosystems.com/",
          "name": "B Systems",
          "inLanguage": "es-ES",
          "publisher": { "@id": "https://basicosystems.com/#organizacion" }
        },
        {
          "@type": "SoftwareApplication",
          "name": "B Systems",
          "url": "https://basicosystems.com/",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": "es-ES",
          "image": "https://basicosystems.com/og-b-systems.jpg",
          "description": "Sistema modular para ventas, inventario, administración, reportes y operaciones a medida.",
          "featureList": [
            "POS", "Inventario", "Reportes", "Administración",
            "WhatsApp CRM", "Planificación en equipo", "Fichaje", "Telefonía comercial"
          ],
          "publisher": { "@id": "https://basicosystems.com/#organizacion" }
        }
      ]
    }
    </script>
  </head>

  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
